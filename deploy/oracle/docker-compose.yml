services:
  addon:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      PORT: 8080
      ADDON_NAME: SpotiFLAC Multi-Source Lossless
      ADDON_VERSION: 0.6.0
      QOBUZ_APP_ID: 798273057
      QOBUZ_COUNTRY_CODE: US
      QOBUZ_SESSION_FILE: /data/qobuz-session.json
      ENABLE_TIDAL: "true"
      TIDAL_API_URL: http://tidal:8000
      ENABLE_AMAZON: "true"
      AMAZON_API_URL: http://amazon:8130
      AMAZON_API_TOKEN: ${AMAZON_API_TOKEN}
    volumes:
      - qobuz_data:/data
    expose:
      - "8080"
    depends_on:
      - tidal
      - amazon
    restart: unless-stopped

  tidal:
    build:
      context: ./tidal
    volumes:
      - tidal_data:/app
    expose:
      - "8000"
    restart: unless-stopped

  amazon:
    build:
      context: ./amazon
    environment:
      AMZ_SESSIONS_FILE: /data/sessions.json
      AMZ_TOKEN_TTL: "86400"
    volumes:
      - amazon_data:/data
    expose:
      - "8130"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - addon
    restart: unless-stopped

volumes:
  qobuz_data:
  tidal_data:
  amazon_data:
  caddy_data:
  caddy_config:
