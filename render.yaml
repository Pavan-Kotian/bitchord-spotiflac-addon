services:
  - type: web
    name: bitchord-spotiflac-addon
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ADDON_NAME
        value: SpotiFLAC Multi-Source Lossless
      - key: ADDON_VERSION
        value: 0.6.0
      - key: QOBUZ_APP_ID
        value: "798273057"
      - key: QOBUZ_COUNTRY_CODE
        value: US
      - key: QOBUZ_SESSION_FILE
        value: /data/qobuz-session.json
      - key: ENABLE_TIDAL
        value: "true"
      - key: ENABLE_AMAZON
        value: "true"
      - key: TIDAL_API_URL
        sync: false
      - key: AMAZON_API_URL
        sync: false
      - key: AMAZON_API_TOKEN
        sync: false
