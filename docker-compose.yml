services:
  resolver:
    build: .
    command: node src/fake-resolver.js
    environment:
      RESOLVER_PORT: 8090
      PUBLIC_BASE_URL: http://localhost:8090
    ports:
      - "8090:8090"

  addon:
    build: .
    environment:
      PORT: 8080
      SPOTIFLAC_RESOLVER_URL: http://resolver:8090
      ADDON_VERSION: 0.3.0
    ports:
      - "8080:8080"
    depends_on:
      - resolver
